name: Kubernetes Microservices CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'src/order-service/package.json'

      - name: Run Order Service Tests
        run: |
          cd src/order-service
          npm install
          npm test

      - name: Run Notification Service Tests
        run: |
          cd src/notification-service
          npm install
          npm test

  security-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Order Service Image
        run: |
          docker build -t order-service:local ./src/order-service

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'order-service:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Dry-Run Client Validation
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/order-service/
          kubectl apply --dry-run=client -f k8s/notification-service/
          kubectl apply --dry-run=client -f k8s/ingress.yaml
          echo "All Kubernetes manifests successfully validated!"
